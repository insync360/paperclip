# Paperclip on a single Compute Engine VM.
#   caddy          -> TLS termination (automatic Let's Encrypt) on :80/:443
#   paperclip      -> the Paperclip server + UI on :3100 (internal only)
#   cloudsql-proxy -> Cloud SQL Auth Proxy; authenticates with the VM's service account
# Values come from /opt/paperclip/.env, written by startup.sh from metadata + Secret Manager.
services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--health-check"
      - "--http-address=0.0.0.0"
      - "${CLOUDSQL_CONNECTION_NAME}"
    restart: unless-stopped

  paperclip:
    image: ${PAPERCLIP_IMAGE}
    restart: unless-stopped
    # tini is PID 1 inside the image; this is the backstop against leaked agent processes.
    pids_limit: 4096
    depends_on:
      - cloudsql-proxy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_CONFIG: /paperclip/instances/default/config.json
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_PUBLIC_URL: https://${PAPERCLIP_DOMAIN}
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}
      HEARTBEAT_SCHEDULER_ENABLED: "true"
      DATABASE_URL: postgres://paperclip:${DB_PASSWORD}@cloudsql-proxy:5432/paperclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY}
      # Optional model-provider keys (empty when the secret does not exist).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /mnt/paperclip/data:/paperclip
    expose:
      - "3100"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - paperclip
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PAPERCLIP_DOMAIN: ${PAPERCLIP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/paperclip/caddy/data:/data
      - /mnt/paperclip/caddy/config:/config
